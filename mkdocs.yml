site_name: Nutanix to Azure Local Migration
site_description: Documentation and automation for migrating workloads from Nutanix AHV and Nutanix ESXi to Azure Local using Veeam, HYCU, Commvault, and deploy-first migration patterns.
site_url: https://azurelocal.github.io/azurelocal-nutanix-migration/
repo_url: https://github.com/AzureLocal/azurelocal-nutanix-migration
repo_name: AzureLocal/azurelocal-nutanix-migration

theme:
  name: material
  palette:
    - scheme: default
      primary: blue
      accent: light blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: blue
      accent: light blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.code.copy
    - content.code.annotate
    - search.suggest
    - search.highlight
  icon:
    repo: fontawesome/brands/github

nav:
  - Home: index.md
  - Overview:
      - Introduction: overview/index.md
      - Migration Phases: overview/migration-phases.md
      - Tool Comparison: overview/tool-comparison.md
  - Migration Scenarios:
      - Choose Your Path: scenarios/index.md
      - Veeam Migration Path:
          - Overview: scenarios/01-veeam/index.md
          - Prerequisites: scenarios/01-veeam/prerequisites.md
          - Architecture: scenarios/01-veeam/architecture.md
          - Runbook: scenarios/01-veeam/runbook.md
          - Validation & Checklist: scenarios/01-veeam/validation.md
      - HYCU Migration Path:
          - Overview: scenarios/02-hycu/index.md
          - Prerequisites: scenarios/02-hycu/prerequisites.md
          - Architecture: scenarios/02-hycu/architecture.md
          - Runbook: scenarios/02-hycu/runbook.md
          - Validation & Checklist: scenarios/02-hycu/validation.md
      - Commvault Migration Path:
          - Overview: scenarios/03-commvault/index.md
          - Prerequisites: scenarios/03-commvault/prerequisites.md
          - Architecture: scenarios/03-commvault/architecture.md
          - Runbook: scenarios/03-commvault/runbook.md
          - Validation & Checklist: scenarios/03-commvault/validation.md
      - Deploy-First Migration (Carbonite):
          - Overview: scenarios/04-deploy-first/index.md
          - Prerequisites: scenarios/04-deploy-first/prerequisites.md
          - Architecture: scenarios/04-deploy-first/architecture.md
          - Runbook: scenarios/04-deploy-first/runbook.md
          - Validation & Checklist: scenarios/04-deploy-first/validation.md
      - Alternative Migration Methods:
          - Overview: scenarios/05-alternative-migration-methods/index.md
          - Prerequisites: scenarios/05-alternative-migration-methods/prerequisites.md
          - Runbook: scenarios/05-alternative-migration-methods/runbook.md
          - Validation & Checklist: scenarios/05-alternative-migration-methods/validation.md
  - Proof of Concept:
      - Overview: poc/index.md
      - Test Matrix: poc/test-matrix.md
      - Timeline & Decisions: poc/timeline.md
  - Diagrams: diagrams/index.md
  - Reference:
      - Tool Comparison Matrix: reference/tool-comparison-matrix.md
      - Network Requirements: reference/network-requirements.md
      - IP Mapping Template: reference/ip-mapping-template.md
      - Glossary: reference/glossary.md
  - Standards: standards/index.md
  - Contributing: contributing.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: true

plugins:
  - search

extra:
  analytics:
    provider: google
    property: G-2D9XDHSXJW
  social:
    - icon: fontawesome/brands/x-twitter
      link: https://x.com/countrycloudboy
      name: CountryCloudBoy on X
    - icon: fontawesome/brands/github
      link: https://github.com/AzureLocal/azurelocal-nutanix-migration
      name: GitHub Repository
    - icon: fontawesome/solid/globe
      link: https://azurelocal.cloud
      name: Azure Local Community
  homepage: https://azurelocal.cloud

copyright: >-
  Copyright &copy; 2025 Azure Local. Designed and maintained by
  <a href="https://www.hybridsolutions.cloud">Hybrid Cloud Solutions</a>.
