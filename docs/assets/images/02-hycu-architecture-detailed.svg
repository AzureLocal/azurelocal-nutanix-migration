<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="820" viewBox="0 0 1600 820">
  <defs>
    <style>
      .title { font: 700 34px Arial, sans-serif; fill: #111827; }
      .subtitle { font: 400 18px Arial, sans-serif; fill: #4b5563; }
      .zone { fill: #ffffff; stroke-width: 3; stroke-dasharray: 10 8; }
      .zone-title { font: 700 22px Arial, sans-serif; fill: #0f172a; }
      .box-title { font: 700 18px Arial, sans-serif; fill: #111827; }
      .text { font: 400 15px Arial, sans-serif; fill: #1f2937; }
      .small { font: 400 14px Arial, sans-serif; fill: #475569; }
      .label { font: 700 17px Arial, sans-serif; fill: #0f172a; }
    </style>
    <marker id="arrow-green" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L12,6 L0,12 z" fill="#16a34a"/></marker>
    <marker id="arrow-orange" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L12,6 L0,12 z" fill="#ea580c"/></marker>
    <marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L12,6 L0,12 z" fill="#2563eb"/></marker>
    <marker id="arrow-purple" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L12,6 L0,12 z" fill="#7c3aed"/></marker>
  </defs>

  <rect width="1600" height="820" fill="#ffffff"/>
  <text x="800" y="52" text-anchor="middle" class="title">HYCU Two-Hop Migration Architecture</text>
  <text x="800" y="82" text-anchor="middle" class="subtitle">HYCU protects Nutanix workloads to a backup target, restores them to Hyper-V as VHDX, and Azure Migrate completes the move to Azure Local</text>

  <rect x="40" y="110" rx="20" ry="20" width="340" height="640" class="zone" stroke="#64748b" fill="#f8fafc"/>
  <rect x="430" y="110" rx="20" ry="20" width="320" height="640" class="zone" stroke="#16a34a" fill="#f0fdf4"/>
  <rect x="800" y="110" rx="20" ry="20" width="330" height="640" class="zone" stroke="#ea580c" fill="#fff7ed"/>
  <rect x="1180" y="110" rx="20" ry="20" width="370" height="640" class="zone" stroke="#2563eb" fill="#eff6ff"/>

  <text x="210" y="145" text-anchor="middle" class="zone-title">Source Estate</text>
  <text x="590" y="145" text-anchor="middle" class="zone-title">HYCU Backup Layer</text>
  <text x="965" y="145" text-anchor="middle" class="zone-title">Hyper-V Staging</text>
  <text x="1365" y="145" text-anchor="middle" class="zone-title">Azure Local Target</text>

  <rect x="90" y="180" rx="16" ry="16" width="240" height="100" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
  <text x="210" y="214" text-anchor="middle" class="box-title">Nutanix Cluster</text>
  <text x="210" y="240" text-anchor="middle" class="text">AHV or ESXi-on-Nutanix</text>
  <text x="210" y="264" text-anchor="middle" class="text">Source workload inventory</text>

  <rect x="90" y="340" rx="16" ry="16" width="240" height="100" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
  <text x="210" y="374" text-anchor="middle" class="box-title">HYCU Controller VM</text>
  <text x="210" y="400" text-anchor="middle" class="text">Runs on Nutanix</text>
  <text x="210" y="424" text-anchor="middle" class="text">Uses native snapshot APIs</text>

  <rect x="90" y="500" rx="16" ry="16" width="240" height="100" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
  <text x="210" y="534" text-anchor="middle" class="box-title">Source VM Wave</text>
  <text x="210" y="560" text-anchor="middle" class="text">10 VMs per migration set</text>
  <text x="210" y="584" text-anchor="middle" class="text">Backup then restore operating model</text>

  <rect x="90" y="650" rx="16" ry="16" width="240" height="70" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <text x="210" y="680" text-anchor="middle" class="box-title">Tool Behavior</text>
  <text x="210" y="704" text-anchor="middle" class="small">No Windows backup server and no AHV proxy VM are required</text>

  <rect x="485" y="200" rx="16" ry="16" width="210" height="110" fill="#bbf7d0" stroke="#16a34a" stroke-width="3"/>
  <text x="590" y="234" text-anchor="middle" class="box-title">Backup Target</text>
  <text x="590" y="260" text-anchor="middle" class="text">SMB, NFS, S3, or iSCSI</text>
  <text x="590" y="284" text-anchor="middle" class="text">Stores full and incremental copies</text>

  <rect x="485" y="390" rx="16" ry="16" width="210" height="120" fill="#bbf7d0" stroke="#16a34a" stroke-width="3"/>
  <text x="590" y="424" text-anchor="middle" class="box-title">Backup and Restore Jobs</text>
  <text x="590" y="450" text-anchor="middle" class="text">Policy-driven wave selection</text>
  <text x="590" y="474" text-anchor="middle" class="text">Automatic disk conversion to VHDX</text>

  <rect x="485" y="610" rx="16" ry="16" width="210" height="90" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/>
  <text x="590" y="642" text-anchor="middle" class="box-title">Hop 1 Behavior</text>
  <text x="590" y="666" text-anchor="middle" class="small">Backups land on HYCU-managed storage before restore into Hyper-V</text>

  <rect x="850" y="200" rx="16" ry="16" width="230" height="110" fill="#fed7aa" stroke="#ea580c" stroke-width="3"/>
  <text x="965" y="234" text-anchor="middle" class="box-title">Hyper-V Target Host</text>
  <text x="965" y="260" text-anchor="middle" class="text">Restore landing zone</text>
  <text x="965" y="284" text-anchor="middle" class="text">Receives VHDX-backed VMs</text>

  <rect x="850" y="390" rx="16" ry="16" width="230" height="110" fill="#fed7aa" stroke="#ea580c" stroke-width="3"/>
  <text x="965" y="424" text-anchor="middle" class="box-title">Restored VMs</text>
  <text x="965" y="450" text-anchor="middle" class="text">Batch validation point</text>
  <text x="965" y="474" text-anchor="middle" class="text">Application and networking checks</text>

  <rect x="850" y="580" rx="16" ry="16" width="230" height="110" fill="#e9d5ff" stroke="#7c3aed" stroke-width="3"/>
  <text x="965" y="614" text-anchor="middle" class="box-title">Azure Migrate Appliance</text>
  <text x="965" y="640" text-anchor="middle" class="text">Discovers Hyper-V via WMI</text>
  <text x="965" y="664" text-anchor="middle" class="text">Coordinates replication to Azure Local</text>

  <rect x="1245" y="220" rx="16" ry="16" width="240" height="110" fill="#bfdbfe" stroke="#2563eb" stroke-width="3"/>
  <text x="1365" y="254" text-anchor="middle" class="box-title">Azure Local Cluster</text>
  <text x="1365" y="280" text-anchor="middle" class="text">CSV or S2D storage</text>
  <text x="1365" y="304" text-anchor="middle" class="text">Arc-enabled infrastructure</text>

  <rect x="1245" y="430" rx="16" ry="16" width="240" height="110" fill="#bfdbfe" stroke="#2563eb" stroke-width="3"/>
  <text x="1365" y="464" text-anchor="middle" class="box-title">Azure Local VMs</text>
  <text x="1365" y="490" text-anchor="middle" class="text">Final landing point after Azure Migrate</text>
  <text x="1365" y="514" text-anchor="middle" class="text">Test and production migration paths</text>

  <rect x="1245" y="620" rx="16" ry="16" width="240" height="80" fill="#ddd6fe" stroke="#7c3aed" stroke-width="3"/>
  <text x="1365" y="652" text-anchor="middle" class="box-title">Azure Control Plane</text>
  <text x="1365" y="676" text-anchor="middle" class="text">Azure Migrate project, Arc, governance</text>

  <line x1="330" y1="390" x2="485" y2="255" stroke="#16a34a" stroke-width="5" marker-end="url(#arrow-green)"/>
  <text x="415" y="292" text-anchor="middle" class="small">Snapshot API and backup copy</text>

  <line x1="695" y1="450" x2="850" y2="450" stroke="#ea580c" stroke-width="6" marker-end="url(#arrow-orange)"/>
  <text x="772" y="412" text-anchor="middle" class="label">Hop 1</text>
  <text x="772" y="434" text-anchor="middle" class="small">HYCU restore to VHDX</text>

  <line x1="1080" y1="450" x2="1245" y2="485" stroke="#2563eb" stroke-width="6" marker-end="url(#arrow-blue)"/>
  <text x="1163" y="412" text-anchor="middle" class="label">Hop 2</text>
  <text x="1163" y="434" text-anchor="middle" class="small">Azure Migrate</text>

  <line x1="1080" y1="635" x2="1245" y2="660" stroke="#7c3aed" stroke-width="4" stroke-dasharray="10 8" marker-end="url(#arrow-purple)"/>
  <text x="1163" y="624" text-anchor="middle" class="small">HTTPS 443 metadata and control</text>
</svg>