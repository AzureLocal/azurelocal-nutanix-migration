<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="500" viewBox="0 0 1400 500">
  <defs>
    <style>
      .title { font: 700 34px Arial, sans-serif; fill: #1f2937; }
      .subtitle { font: 400 18px Arial, sans-serif; fill: #4b5563; }
      .label { font: 700 24px Arial, sans-serif; fill: #111827; }
      .small { font: 400 18px Arial, sans-serif; fill: #374151; }
      .hop { font: 700 20px Arial, sans-serif; fill: #0f766e; }
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 z" fill="#0f766e" />
    </marker>
  </defs>

  <rect x="0" y="0" width="1400" height="500" fill="#ffffff" />

  <text x="700" y="55" text-anchor="middle" class="title">Common Two-Hop Migration Pattern</text>
  <text x="700" y="85" text-anchor="middle" class="subtitle">Nutanix source workloads move to Hyper-V staging, then into Azure Local</text>

  <rect x="90" y="170" rx="16" ry="16" width="340" height="160" fill="#dbeafe" stroke="#3b82f6" stroke-width="3"/>
  <text x="260" y="240" text-anchor="middle" class="label">Nutanix AHV / ESXi</text>
  <text x="260" y="272" text-anchor="middle" class="small">Source</text>

  <rect x="530" y="170" rx="16" ry="16" width="340" height="160" fill="#fef3c7" stroke="#f59e0b" stroke-width="3"/>
  <text x="700" y="240" text-anchor="middle" class="label">Hyper-V Staging</text>
  <text x="700" y="272" text-anchor="middle" class="small">Intermediate</text>

  <rect x="970" y="170" rx="16" ry="16" width="340" height="160" fill="#dcfce7" stroke="#22c55e" stroke-width="3"/>
  <text x="1140" y="240" text-anchor="middle" class="label">Azure Local</text>
  <text x="1140" y="272" text-anchor="middle" class="small">Target</text>

  <line x1="430" y1="250" x2="530" y2="250" stroke="#0f766e" stroke-width="5" marker-end="url(#arrow)"/>
  <text x="480" y="220" text-anchor="middle" class="hop">Hop 1</text>
  <text x="480" y="380" text-anchor="middle" class="small">Migration Tool</text>

  <line x1="870" y1="250" x2="970" y2="250" stroke="#0f766e" stroke-width="5" marker-end="url(#arrow)"/>
  <text x="920" y="220" text-anchor="middle" class="hop">Hop 2</text>
  <text x="920" y="380" text-anchor="middle" class="small">Azure Migrate</text>
</svg>
