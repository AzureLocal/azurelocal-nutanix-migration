<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="980" viewBox="0 0 1800 980">
  <defs>
    <style>
      .title { font: 700 40px Arial, sans-serif; fill: #111827; }
      .sub { font: 400 20px Arial, sans-serif; fill: #4b5563; }
      .lane { font: 700 22px Arial, sans-serif; fill: #1f2937; }
      .phaseNo { font: 700 24px Arial, sans-serif; fill: #111827; }
      .phaseTxt { font: 400 18px Arial, sans-serif; fill: #1f2937; }
      .note { font: 400 18px Arial, sans-serif; fill: #374151; }
      .chip { font: 700 16px Arial, sans-serif; fill: #111827; }
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 z" fill="#475569" />
    </marker>
  </defs>

  <rect width="1800" height="980" fill="#ffffff"/>
  <text x="900" y="58" text-anchor="middle" class="title">Migration Phases Overview</text>
  <text x="900" y="92" text-anchor="middle" class="sub">Two-hop workflow from planning through cleanup</text>

  <rect x="70" y="130" width="1660" height="185" rx="16" fill="#e8f0fe" stroke="#4a86e8" stroke-width="2"/>
  <rect x="70" y="335" width="1660" height="185" rx="16" fill="#fff4e5" stroke="#d79b00" stroke-width="2"/>
  <rect x="70" y="540" width="1660" height="185" rx="16" fill="#e6f4ea" stroke="#34a853" stroke-width="2"/>
  <rect x="70" y="745" width="1660" height="185" rx="16" fill="#f3e8ff" stroke="#8e7cc3" stroke-width="2"/>

  <text x="105" y="165" class="lane">Plan</text>
  <text x="105" y="370" class="lane">Stage</text>
  <text x="105" y="575" class="lane">Migrate</text>
  <text x="105" y="780" class="lane">Validate &amp; Close</text>

  <g transform="translate(150,180)">
    <rect x="0" y="0" width="210" height="95" rx="12" fill="#d5e3fd" stroke="#4a86e8" stroke-width="2"/>
    <text x="20" y="36" class="phaseNo">0</text><text x="55" y="36" class="phaseTxt">Planning &amp; Inventory</text>
  </g>
  <g transform="translate(390,180)">
    <rect x="0" y="0" width="210" height="95" rx="12" fill="#d5e3fd" stroke="#4a86e8" stroke-width="2"/>
    <text x="20" y="36" class="phaseNo">1</text><text x="55" y="36" class="phaseTxt">Environment Prep</text>
  </g>

  <g transform="translate(630,385)">
    <rect x="0" y="0" width="230" height="95" rx="12" fill="#fdebd0" stroke="#d79b00" stroke-width="2"/>
    <text x="20" y="36" class="phaseNo">2</text><text x="55" y="36" class="phaseTxt">Initial Replication</text>
    <text x="55" y="62" class="phaseTxt">/ Backup</text>
  </g>
  <g transform="translate(890,385)">
    <rect x="0" y="0" width="210" height="95" rx="12" fill="#fdebd0" stroke="#d79b00" stroke-width="2"/>
    <text x="20" y="36" class="phaseNo">3</text><text x="55" y="36" class="phaseTxt">Incremental Sync</text>
  </g>
  <g transform="translate(1130,385)">
    <rect x="0" y="0" width="220" height="95" rx="12" fill="#fdebd0" stroke="#d79b00" stroke-width="2"/>
    <text x="20" y="36" class="phaseNo">4</text><text x="55" y="36" class="phaseTxt">Cutover to Staging</text>
  </g>

  <g transform="translate(1350,590)">
    <rect x="0" y="0" width="220" height="95" rx="12" fill="#d9f2e6" stroke="#34a853" stroke-width="2"/>
    <text x="20" y="36" class="phaseNo">5</text><text x="55" y="36" class="phaseTxt">Staging Validation</text>
  </g>
  <g transform="translate(1110,590)">
    <rect x="0" y="0" width="230" height="95" rx="12" fill="#d9f2e6" stroke="#34a853" stroke-width="2"/>
    <text x="20" y="36" class="phaseNo">6</text><text x="55" y="36" class="phaseTxt">Azure Migrate</text>
    <text x="55" y="62" class="phaseTxt">Replication</text>
  </g>
  <g transform="translate(860,590)">
    <rect x="0" y="0" width="220" height="95" rx="12" fill="#d9f2e6" stroke="#34a853" stroke-width="2"/>
    <text x="20" y="36" class="phaseNo">7</text><text x="55" y="36" class="phaseTxt">Test Migration</text>
  </g>
  <g transform="translate(610,590)">
    <rect x="0" y="0" width="230" height="95" rx="12" fill="#d9f2e6" stroke="#34a853" stroke-width="2"/>
    <text x="20" y="36" class="phaseNo">8</text><text x="55" y="36" class="phaseTxt">Azure Migrate</text>
    <text x="55" y="62" class="phaseTxt">Cutover</text>
  </g>

  <g transform="translate(400,795)">
    <rect x="0" y="0" width="230" height="95" rx="12" fill="#eadcf8" stroke="#8e7cc3" stroke-width="2"/>
    <text x="20" y="36" class="phaseNo">9</text><text x="55" y="36" class="phaseTxt">Azure Local</text>
    <text x="55" y="62" class="phaseTxt">Validation</text>
  </g>
  <g transform="translate(660,795)">
    <rect x="0" y="0" width="210" height="95" rx="12" fill="#eadcf8" stroke="#8e7cc3" stroke-width="2"/>
    <text x="20" y="36" class="phaseNo">10</text><text x="65" y="36" class="phaseTxt">Cleanup</text>
  </g>

  <line x1="360" y1="228" x2="390" y2="228" stroke="#475569" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="600" y1="228" x2="630" y2="432" stroke="#475569" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="860" y1="432" x2="890" y2="432" stroke="#475569" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="1100" y1="432" x2="1130" y2="432" stroke="#475569" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="1350" y1="432" x2="1460" y2="590" stroke="#475569" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="1350" y1="638" x2="1340" y2="638" stroke="#475569" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="1110" y1="638" x2="1080" y2="638" stroke="#475569" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="860" y1="638" x2="840" y2="638" stroke="#475569" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="610" y1="638" x2="510" y2="795" stroke="#475569" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="630" y1="843" x2="660" y2="843" stroke="#475569" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="1070" y="805" width="590" height="86" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="1095" y="840" class="chip">Typical batch cadence: 3-5 business days</text>
  <text x="1095" y="868" class="chip">Scope: Two-hop scenarios (Veeam/HYCU + Azure Migrate)</text>
</svg>
