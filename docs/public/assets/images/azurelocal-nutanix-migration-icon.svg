<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1A86D8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#003A70;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#001A3A" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="200" height="200" rx="38" ry="38" fill="url(#bgGrad)"/>

  <g opacity="0.08" stroke="white" stroke-width="0.8">
    <line x1="0" y1="50" x2="200" y2="50"/>
    <line x1="0" y1="100" x2="200" y2="100"/>
    <line x1="0" y1="150" x2="200" y2="150"/>
    <line x1="50" y1="0" x2="50" y2="200"/>
    <line x1="100" y1="0" x2="100" y2="200"/>
    <line x1="150" y1="0" x2="150" y2="200"/>
  </g>

  <g transform="translate(100,32)" filter="url(#shadow)">
    <polygon points="0,-14 14,-5 10,12 0,7 -10,12 -14,-5" fill="#E67E22" stroke="#CA6F1E" stroke-width="0.8"/>
    <text x="0" y="3" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="9" fill="white">N</text>
  </g>

  <g filter="url(#shadow)">
    <circle cx="100" cy="100" r="46" fill="white"/>
    <circle cx="100" cy="100" r="38" fill="url(#bgGrad)"/>

    <!-- Source platform node (Nutanix) — left diamond -->
    <polygon points="79,100 69,110 79,120 89,110" fill="#E67E22" opacity="0.85"/>
    <polygon points="79,100 69,90 79,80 89,90" fill="#E67E22" opacity="0.55"/>
    <line x1="79" y1="80" x2="79" y2="120" stroke="#E67E22" stroke-width="1" opacity="0.40"/>

    <!-- Migration flow arrows (3 lines) -->
    <line x1="93" y1="91" x2="108" y2="91" stroke="#E67E22" stroke-width="1.8" opacity="0.85"/>
    <polygon points="108,91 104,88 104,94" fill="#E67E22" opacity="0.85"/>
    <line x1="93" y1="100" x2="108" y2="100" stroke="#E67E22" stroke-width="1.8" opacity="0.65"/>
    <polygon points="108,100 104,97 104,103" fill="#E67E22" opacity="0.65"/>
    <line x1="93" y1="109" x2="108" y2="109" stroke="#E67E22" stroke-width="1.8" opacity="0.45"/>
    <polygon points="108,109 104,106 104,112" fill="#E67E22" opacity="0.45"/>

    <!-- Destination (Azure Local) — right rectangle cluster -->
    <rect x="111" y="83" width="18" height="13" rx="2" fill="#E67E22" opacity="0.85"/>
    <rect x="111" y="99" width="18" height="13" rx="2" fill="#E67E22" opacity="0.60"/>
    <line x1="120" y1="96" x2="120" y2="99" stroke="#E67E22" stroke-width="1.2" opacity="0.60"/>
    <!-- Azure arc mark on top node -->
    <path d="M113,117 Q120,113 127,117" fill="none" stroke="white" stroke-width="1.3" opacity="0.75"/>
    <circle cx="120" cy="114" r="2" fill="white" opacity="0.65"/>

    <circle cx="100" cy="100" r="38" fill="none" stroke="white" stroke-width="1.5" opacity="0.2"/>
  </g>

  <text x="100" y="168" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-weight="bold" font-size="13" fill="white" letter-spacing="1" opacity="0.95">AZURE LOCAL</text>
  <text x="100" y="186" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-weight="bold" font-size="10" fill="#E67E22" letter-spacing="1" opacity="0.95">NUTANIX MIGRATION</text>
</svg>
